[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "alembic>=1.16.5",
    "asyncpg>=0.32.0",
    "fastapi>=0.128.8",
    "pwdlib[argon2]>=0.2.1",
    "pydantic-settings>=2.11.0",
    "pydantic[email]>=2.13.5",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.20",
    "sqlalchemy[asyncio]>=2.0.58",
    "uvicorn[standard]>=0.39.0",
]

[project.scripts]
backend = "app:main"

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[tool.ruff.lint]
# FastAPI evaluates annotations at runtime on Python 3.9.
ignore = ["FA100"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
section-order = [
    "future",
    "standard-library",
    "fastapi",
    "database",
    "validation",
    "third-party",
    "first-party",
    "local-folder",
]
import-heading = { future = "Future Imports", standard-library = "Python Modules", fastapi = "FastAPI Modules", database = "Database Modules", validation = "Validation Modules", third-party = "Third-Party Modules", first-party = "Project Modules", local-folder = "Local Modules" }

[tool.ruff.lint.isort.sections]
fastapi = ["fastapi", "starlette", "uvicorn"]
database = ["sqlalchemy", "alembic", "asyncpg", "aiosqlite"]
validation = ["pydantic", "pydantic_settings"]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
